name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Syntax & Lint Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Backend JavaScript Syntax
        run: |
          for file in $(find src -name "*.js"); do
            node -c "$file"
          done
          echo "All backend JavaScript files validated successfully."
