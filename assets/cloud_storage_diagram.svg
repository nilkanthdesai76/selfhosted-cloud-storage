<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">Self-Hosted Cloud Storage Architecture</text>
  <text x="480" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">High-throughput hybrid storage tiering, content-addressed deduplication, and encrypted link sharing</text>

  <!-- Card 1: Client Layer -->
  <g transform="translate(30, 95)" filter="url(#cardShadow)">
    <rect width="210" height="290" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#cyanGrad)" />
    <rect y="26" width="210" height="12" fill="url(#cyanGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Client Interfaces</text>

    <rect x="14" y="55" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" fill="#38bdf8" font-size="12" font-weight="600">React + Vite SPA</text>
    <text x="24" y="90" fill="#94a3b8" font-size="10">Drag & drop chunked uploads</text>

    <rect x="14" y="111" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="130" fill="#f8fafc" font-size="12" font-weight="600">WeTransfer Portal</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">Expiring password shares</text>

    <rect x="14" y="167" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="186" fill="#f8fafc" font-size="12" font-weight="600">REST API Gateway</text>
    <text x="24" y="202" fill="#94a3b8" font-size="10">API keys & secret token auth</text>

    <rect x="14" y="223" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="242" fill="#f8fafc" font-size="12" font-weight="600">CLI & curl Scripts</text>
    <text x="24" y="258" fill="#94a3b8" font-size="10">Headless automated ingestion</text>
  </g>

  <!-- Card 2: API & Gateway -->
  <g transform="translate(260, 95)" filter="url(#cardShadow)">
    <rect width="210" height="290" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#violetGrad)" />
    <rect y="26" width="210" height="12" fill="url(#violetGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Gateway & Auth</text>

    <rect x="14" y="55" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" fill="#c084fc" font-size="12" font-weight="600">Express 4 + Helmet</text>
    <text x="24" y="90" fill="#94a3b8" font-size="10">HSTS, CORS & secure headers</text>

    <rect x="14" y="111" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="130" fill="#f8fafc" font-size="12" font-weight="600">JWT & Refresh Engine</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">Bcrypt password hashing</text>

    <rect x="14" y="167" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="186" fill="#f8fafc" font-size="12" font-weight="600">Rate Limiter</text>
    <text x="24" y="202" fill="#94a3b8" font-size="10">Redis distributed token bucket</text>

    <rect x="14" y="223" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="242" fill="#f8fafc" font-size="12" font-weight="600">Quota Enforcer</text>
    <text x="24" y="258" fill="#94a3b8" font-size="10">Free, Pro & Enterprise tiers</text>
  </g>

  <!-- Card 3: Storage Engine -->
  <g transform="translate(490, 95)" filter="url(#cardShadow)">
    <rect width="210" height="290" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#amberGrad)" />
    <rect y="26" width="210" height="12" fill="url(#amberGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Storage Core & Queue</text>

    <rect x="14" y="55" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" fill="#fbbf24" font-size="12" font-weight="600">SHA-256 Deduplication</text>
    <text x="24" y="90" fill="#94a3b8" font-size="10">Zero-waste duplicate storage</text>

    <rect x="14" y="111" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="130" fill="#f8fafc" font-size="12" font-weight="600">Hybrid Sharding</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">Hot SSD vs Cold HDD routes</text>

    <rect x="14" y="167" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="186" fill="#f8fafc" font-size="12" font-weight="600">Bull Queue Workers</text>
    <text x="24" y="202" fill="#94a3b8" font-size="10">Async cold migration & cleanup</text>

    <rect x="14" y="223" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="242" fill="#f8fafc" font-size="12" font-weight="600">Trash Lifecycle</text>
    <text x="24" y="258" fill="#94a3b8" font-size="10">30-day auto-purge policy</text>
  </g>

  <!-- Card 4: Persistence Layer -->
  <g transform="translate(720, 95)" filter="url(#cardShadow)">
    <rect width="210" height="290" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="210" height="38" rx="14" fill="url(#greenGrad)" />
    <rect y="26" width="210" height="12" fill="url(#greenGrad)" />
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Persistence & Volumes</text>

    <rect x="14" y="55" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="74" fill="#34d399" font-size="12" font-weight="600">PostgreSQL (Prisma)</text>
    <text x="24" y="90" fill="#94a3b8" font-size="10">Metadata, users, share links</text>

    <rect x="14" y="111" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="130" fill="#f8fafc" font-size="12" font-weight="600">Redis Cache</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">Session tokens & Bull queues</text>

    <rect x="14" y="167" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="186" fill="#f8fafc" font-size="12" font-weight="600">Hot NVMe Shards</text>
    <text x="24" y="202" fill="#94a3b8" font-size="10">4x parallel NVMe directories</text>

    <rect x="14" y="223" width="182" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="24" y="242" fill="#f8fafc" font-size="12" font-weight="600">Cold HDD Archive</text>
    <text x="24" y="258" fill="#94a3b8" font-size="10">Low-cost bulk storage tier</text>
  </g>

  <!-- Connectors -->
  <path d="M 240 240 L 260 240" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M 470 240 L 490 240" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M 700 240 L 720 240" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Footer Pills -->
  <g transform="translate(160, 404)">
    <rect width="135" height="22" rx="6" fill="#1e293b" />
    <text x="67" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">Docker Compose</text>
  </g>
  <g transform="translate(315, 404)">
    <rect width="145" height="22" rx="6" fill="#1e293b" />
    <text x="72" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">Prisma PostgreSQL</text>
  </g>
  <g transform="translate(480, 404)">
    <rect width="135" height="22" rx="6" fill="#1e293b" />
    <text x="67" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">WeTransfer Sharing</text>
  </g>
  <g transform="translate(635, 404)">
    <rect width="155" height="22" rx="6" fill="#1e293b" />
    <text x="77" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">Hot / Cold Sharding</text>
  </g>
</svg>
